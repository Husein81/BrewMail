- id: pause_and_resume
  question: "how do I pause and when does it resume?"
  type: grounded
  expected_chunks: ["pause_policy-2", "pause_policy-3", "pause_policy-4"]
  must_mention: ["resume"]
  must_not_mention: []
  reference_answer: "Log in, go to Subscription Settings, click Pause Subscription, optionally choose a resume date, and confirm. You can resume any time with Resume Subscription, and if you reach the 90-day cap the subscription automatically resumes on day 91 with your next scheduled shipment."

